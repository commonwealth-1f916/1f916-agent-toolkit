name: ci

# What this is for. The gate's acceptance tests were run by hand, once, by their
# author, on one machine, and recorded in a private operating document. That is
# the same class of claim this project spends its time filing against other
# people's code: a check nobody but its author has watched. These run on every
# push, need no secret and no network, and can be read by a stranger.

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly, because the thing most likely to break these scripts is no longer
  # the scripts. They have stopped changing; the runners have not. The gate's
  # portability claims are about curl, node, jq, GNU vs BSD date and stat, and
  # bash 3.2 on macOS -- all of which move underneath a quiet repository. On
  # push alone, a green badge on a repo nobody has touched in a month is a
  # reading from a month ago. (GitHub disables scheduled workflows after 60
  # days without repository activity; if this stops firing, that is why.)
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the test scripts at full severity
        run: shellcheck tests/gate.sh tests/alert.sh tests/config-transport.sh tests/sign.sh tests/mutants.sh tests/hygiene.sh tests/scan.sh tests/stub-curl
      - name: shellcheck the shipped scripts at full severity
        # Raised from --severity=warning here, in the change that cleared the
        # two info-level SC2015 notes it was holding the line for.
        run: shellcheck -s sh 1f916-gate && shellcheck -s sh 1f916-scan && shellcheck witness-alert.sh && shellcheck 1f916-ssh-sign

  hygiene:
    # Properties of the TREE rather than of the programs: the shipped scripts
    # are recorded executable, and no site-specific value is tracked. Both were
    # load-bearing claims that nothing enforced -- the first cost a deploy an
    # exit 126 on 2026-09-02, and the second is the entire reason the config was
    # externalised.
    strategy:
      fail-fast: false
      matrix:
        # Both hosts, and not for the tree's sake -- the verdict is the same on
        # either. It is this script's own portability that needs the second
        # runner: its first draft used an empty `case` branch, which POSIX
        # allows and shellcheck accepts and bash 3.2 on macOS rejects outright.
        # Linux was green while the script would not parse on one of the two
        # machines it guards.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: the scan can go red -- prove it before trusting it green
        # FIRST, deliberately. A scanner that has been broken into always
        # passing is indistinguishable from a clean tree, and the green tick
        # would be the only evidence either way. This plants one specimen of
        # every shape it claims to catch and requires a catch on all of them,
        # then requires the deliberately-published values NOT to trip it.
        run: sh tests/hygiene.sh --self-test
      - name: recorded modes and no site-specific values
        run: sh tests/hygiene.sh

  gate-tests:
    strategy:
      fail-fast: false
      matrix:
        # Both hosts on purpose: the gate runs on a macOS laptop and a Debian
        # Raspberry Pi, and the differences between them (shasum vs sha256sum,
        # GNU vs BSD date and stat) are exactly where its portability claims
        # have gone untested.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: tools present
        run: |
          for t in jq node curl; do
            command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }
          done
          node --version; jq --version; curl --version | head -1
      - name: gate acceptance tests
        run: sh tests/gate.sh
      - name: credential transport against REAL curl
        # tests/gate.sh proves the gate calls curl with a config on a pipe; its
        # curl is a shell script and cannot prove real curl reads it. This
        # talks to a throwaway server on loopback and checks ps(1), with a
        # control that requires ps to find the token in the old -H form first.
        run: sh tests/config-transport.sh
      - name: identity-key signing chain, with a throwaway key and no op
        # The seed tool's guard, the PEM it emits (checked by ssh-keygen), and
        # 1f916-ssh-sign driven by git commit -S against a throwaway agent.
        run: sh tests/sign.sh
      - name: credential scan tool -- finds a planted copy, never prints it
        run: sh tests/scan.sh
      - name: alert behaviour tests
        # Skips itself on macOS: witness-alert.sh is Linux-only by its own
        # header (GNU date -d, stat -c) and says so rather than pretending.
        run: sh tests/alert.sh
      - name: mutation check -- prove the suite can go red
        run: sh tests/mutants.sh
